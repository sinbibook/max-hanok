<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>Max 한옥 - 오시는길</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Max 한옥 - 오시는길" />
  
  <meta property="og:image" content="https://bookingplay-media-fred.s3.amazonaws.com/item_images/2021/12/06/kOscAnHqKp4e.jpg" />
  <meta property="og:url" content="https://max-hanok.com" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Max 한옥 - 오시는길" />
  
  <meta name="twitter:image" content="https://bookingplay-media-fred.s3.amazonaws.com/item_images/2021/12/06/kOscAnHqKp4e.jpg" />
  <meta name="naver-site-verification" content="fqwffqwqfqwf" />
  <meta name="google-site-verification" content="fqwegwegggwegewgwegweg" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 traffic.html (오시는길).
             원본은 daum roughmap 임베드(고정 key)였으나 좌표 기반 kakao-maps-sdk 로 교체했다. -->
        <section id="content" class="sub6_1 sub_map">
          <div class="sub_visual_wide visual" data-directions-hero-bg>
            <div class="visual_title">
              <strong>MAP,</strong>
              <div class="sub_cate_wrap">
                <ul>
                  <li class="on"><a href="./directions.html">오시는길</a></li>
                </ul>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cont">
            <div class="view_cate_box">
              <div class="sub_title">
                <h3>MAP</h3>
                <p data-directions-body-title>위치안내</p>
              </div>
            </div>
            <div class="map_box sub_inner">
              <div>
                <!-- data-* 속성 : property.latitude / property.longitude -->
                <div id="kakao-map"></div>
                <!-- data-* 속성 : data-property-address (property.address) -->
                <strong data-property-address></strong>
              </div>
            </div>
            <div class="info_box">
              <dl>
                <dt class="view_cate_box">
                  <div class="sub_title">
                    <h3>CAR</h3>
                    <p data-directions-notice-title>자가용 이용시</p>
                  </div>
                </dt>
                <!-- data-* 속성 : data-directions-notice
                     pages.directions.sections[0].notice.description -->
                <dd data-directions-notice></dd>
              </dl>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/directions-mapper.js"></script>
    <script src="js/kakao-maps-sdk.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/directions.js"></script>
  </body>
</html>
